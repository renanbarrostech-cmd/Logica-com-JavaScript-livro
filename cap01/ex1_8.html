<meta charset="UTF-8">
<script>
    const dias = Number(prompt("Digite a quantidade de dias: ")) // Lê a quantidade de dias do usuário
    const horas = Number(prompt("Digite a quantidade de horas: ")) // Lê a quantidade de horas do usuário
    const totalHoras = (dias * 24) + horas // Calcula o total de horas
    alert(`O total de horas é: ${totalHoras}`) // Exibe o total de horas
</script>
