<meta charset="UTF-8">

<script>
    const num1 = prompt("Digite o primeiro número: ") // Lê o primeiro número do usuário
    const num2 = prompt("Digite o segundo número: ") // Lê o segundo número do usuário
    const soma = Number(num1) + Number(num2) // Converte os números para Number e calcula a soma
    alert("A soma de " + num1 + " e " + num2 + " é " + soma) // Exibe o resultado
</script>
