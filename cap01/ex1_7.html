<meta charset="UTF-8">
<script>
// Calculo do valor do jantar

const jantar = Number(prompt("Digite o valor do jantar: ")) // Lê o valor do jantar do usuário
const garcom = jantar * 0.1 // Calcula 10% do valor do jantar
const total = jantar + garcom // Calcula o valor total a ser pago
alert(`Taxa Garçom R$ ${garcom.toFixed(2)}\nValor Total R$ ${total.toFixed(2)}`) // Exibe o valor da taxa do garçom e o valor total a ser pago  

</script>
