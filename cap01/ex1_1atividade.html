<meta charset="UTF-8">

<script>
    // Questão A) Elaborar um programa que leia um número. Calcule e informe os seus vizinhos, ou seja, anterior e posterior.

    // praticando 
    const numero = Number(prompt("Digite um número: "));
    const anterior = numero - 1; // Calcula o número anterior
    const posterior = numero + 1; // Calcula o número posterior
    alert(`O número anterior é: ${anterior}\nO número posterior é: ${posterior}`); // Exibe o número anterior e posterior
</script>
